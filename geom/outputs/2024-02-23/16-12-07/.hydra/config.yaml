flower_server_cfg:
  ns3:
    tcp_ip: 127.0.0.1
    port: 8080
    path: ../../ns-3.35/
    program: wifi_exp
    clients:
      total: 4
      for_fit: 2
      for_eval: 2
    network_type: wifi
    network:
      wifi:
        tx_gain: 20
        max_packet_size: 1024
      ethernet:
        max_packet_size: 1024
    model_type: fashion_mnist
    model:
      mnist:
        size: 1200.0
      fashion_mnist:
        size: 2000.0
      cifar10:
        size: 200
      cifar100:
        size: 40000.0
    data_rate: 80Mbps
    link_speed:
      min: 5000
      max: 5000
      std: 0
    server: sync
  flower_server_address: 0.0.0.0:8090
  metric_server_address: 0.0.0.0:8091
  num_rounds: 6
  fit_cfg:
    epochs: 1
    verbose: 2
    batch_size: 32
  eval_cfg:
    verbose: 1
    batch_size: 64
metric_server_cfg:
  threshold: 25
  thres_discount_factor: 0.8
  thread_max_workers: 10
  metric_server_address: 0.0.0.0:8091
