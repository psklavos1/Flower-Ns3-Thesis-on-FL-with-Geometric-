server_address: 0.0.0.0:8090
metric_server_address: 127.0.0.1:8091
dataset: mnist
num_clients: 4
ns3:
  tcp_ip: 127.0.0.1
  port: 8080
  path: ../../ns-3.35/
  program: wifi_exp
  visualize: false
  clients:
    total: ${num_clients}
    for_fit: 3
    for_eval: 2
  network_type: wifi
  network:
    wifi:
      tx_gain: 20
      max_packet_size: 1024
    ethernet:
      max_packet_size: 1024
  model_type: ${dataset}
  model:
    mnist:
      size: 1400.0
    fashion_mnist:
      size: 2000.0
    cifar10:
      size: 5000.0
    cifar100:
      size: 70000.0
  data_rate: 80Mbps
  device_type: '400'
  server: sync
flower_server_cfg:
  flower_server_address: ${server_address}
  metric_server_address: ${metric_server_address}
  num_rounds: 3
  fit_cfg:
    epochs: 3
    verbose: 2
    batch_size: 32
  eval_cfg:
    verbose: 1
    batch_size: 64
metric_server_cfg:
  threshold: 25
  thres_discount_factor: 0.8
  thread_max_workers: 10
  metric_server_address: ${metric_server_address}
