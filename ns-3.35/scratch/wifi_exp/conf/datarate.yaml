hydra:
  run:
    dir: ./
  output_subdir: null  # Disables the creation of subdirectories within the output directory

  job_logging:
    root:
      handlers: null  # This will disable logging to files

minForServer: 60   # Mbps
maxForServer: 100  # Mbps
minForClients: 1000 # kbps
maxForClients: 2500 # kbps

input_filepath: "./node_coordinates.txt"
output_filepath: "./datarates.txt"  # The output file name


