ns3:
  tcp_ip: "127.0.0.1"
  port: 8080
  path: "../../ns-3.35/"
  program: "wifi_exp"
  visualize: False # To Run PyVis for replication(Not working well in parallel with sim. Prefer NetAnim)
  network_type: "wifi" 
  network:
    wifi:
      tx_gain: 0
      max_packet_size: 1024
    ethernet:
      max_packet_size: 1024
  model_type: ${dataset} # Used merged in server.yaml to load together. 
  
  model: # Approximation of serialized model sizes
    mnist:
      size: 1400.00
    fashion_mnist:
      size: 2000.00
    cifar10:
      size: 5000.00
    cifar100:
      size: 70000.00
  
  # Not being utilized currently
  device_type: "400"
  server: "sync"
