server_address: 0.0.0.0:8090
metric_server_address: 127.0.0.1:8091
dataset: mnist
ann: lenet
num_clients: 3
ns3:
  wifi_net_template: 1
  moving_clients: false
  tcp_ip: 127.0.0.1
  port: 8080
  path: ../../ns-3.35/
  program: wifi_exp
  visualize: false
  network_type: wifi
  network:
    wifi:
      tx_gain: 0
      max_packet_size: 1024
    ethernet:
      max_packet_size: 1024
  dataset: ${dataset}
  ann: ${ann}
  model_sizes:
    mnist:
      vgg: 0
      resnet: 0
      alexnet: 111434
      lenet: 279
      default: 1387
    fashion_mnist:
      vgg: 0
      resnet: 0
      alexnet: 111434
      lenet: 279
      default: 1932
    cifar10:
      vgg: 131473
      resnet: 92677
      alexnet: 140110
      lenet: 363
      default: 5040
    cifar100:
      vgg: 132913
      resnet: 93397
      alexnet: 141551
      lenet: 392
      default: 69739
  device_type: '400'
  server: sync
flower_server_cfg:
  flower_server_address: ${server_address}
  metric_server_address: ${metric_server_address}
  num_rounds: 5
  wait_ns3_establishment: 4
  clients:
    total: ${num_clients}
    for_fit: ${num_clients}
    for_eval: ${num_clients}
  fit_cfg:
    epochs: 1
    verbose: 2
    batch_size: 32
  eval_cfg:
    verbose: 0
    batch_size: 64
metric_server_cfg:
  threshold: 5
  thres_discount_factor: 1
  thread_max_workers: 30
  metric_server_address: ${metric_server_address}
