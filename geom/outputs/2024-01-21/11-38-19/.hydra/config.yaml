flower_server_cfg:
  ns3:
    tcp_ip: 127.0.0.1
    port: 8080
    path: ../../ns3/
    program: wifi_exp
    clients:
      total: 3
      for_fit: 2
      for_eval: 2
    network_type: wifi
    network:
      wifi:
        tx_gain: 0
        max_packet_size: 256
      ethernet:
        max_packet_size: 1024
    server: sync
  flower_server_address: 0.0.0.0:8090
  metric_server_address: 0.0.0.0:8091
  num_rounds: 6
  fit_cfg:
    epochs: 1
    verbose: 1
    batch_size: 32
  eval_cfg:
    verbose: 1
    batch_size: 64
metric_server_cfg:
  threshold: 25
  thres_discount_factor: 0.8
  thread_max_workers: 10
  metric_server_address: 0.0.0.0:8091
